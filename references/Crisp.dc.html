<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400..700&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@300;400&display=swap" rel="stylesheet" />
<style>
  body { margin:0; background:#EFE9E1; -webkit-font-smoothing:antialiased; }
  a { color:#211E1B; text-decoration:none; }
  a:hover { color:#766E65; }
  ::selection { background:rgba(33,30,27,.12); }
</style>
</helmet>

<div style="min-height:100vh; background:#EFE9E1; color:#211E1B; font-family:'Instrument Sans',system-ui,sans-serif; padding:0 44px 100px;">
  <div style="max-width:1000px; margin:0 auto;">

    <header style="padding:90px 0 54px; display:flex; flex-direction:column; gap:18px; max-width:620px;">
      <div style="font-family:'JetBrains Mono',monospace; font-size:10.5px; letter-spacing:.16em; text-transform:uppercase; color:#A2988C;">Crisp · voice-first tasks · V1 design</div>
      <h1 style="margin:0; font-family:'Instrument Serif',Georgia,serif; font-weight:400; font-size:58px; line-height:1.02; letter-spacing:-.025em;">Tap once. Talk. Your tasks fall into place.</h1>
      <p style="margin:0; font-size:17px; line-height:1.55; color:#5A5249; text-wrap:pretty;">Four files. The app carries every screen state and runs on a real microphone; the rest exist so the idea survives handoff.</p>
    </header>

    <div style="display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:16px;">
      <sc-for list="{{ cards }}" as="c" hint-placeholder-count="4">
        <a href="{{ c.href }}" style="display:flex; flex-direction:column; gap:11px; padding:26px 26px 28px; border-radius:18px; background:#F6F1EA; transition:background .25s ease, transform .25s ease, transform .25s cubic-bezier(.2,.8,.2,1);" style-hover="background:#FFFDF9; transform:translateY(-2px)">
          <div style="display:flex; align-items:baseline; justify-content:space-between; gap:12px;">
            <span style="font-family:'JetBrains Mono',monospace; font-size:10.5px; letter-spacing:.14em; text-transform:uppercase; color:#A2988C;">{{ c.n }}</span>
            <span style="font-family:'JetBrains Mono',monospace; font-size:10.5px; color:#B9AFA3;">{{ c.tag }}</span>
          </div>
          <div style="font-family:'Instrument Serif',Georgia,serif; font-size:29px; line-height:1.1; letter-spacing:-.015em;">{{ c.title }}</div>
          <div style="font-size:14.5px; line-height:1.55; color:#5A5249; text-wrap:pretty;">{{ c.body }}</div>
          <div style="margin-top:8px; font-size:13.5px; color:#766E65;">{{ c.cta }} →</div>
        </a>
      </sc-for>
    </div>

    <section style="padding:64px 0 0; display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:34px;">
      <sc-for list="{{ notes }}" as="n" hint-placeholder-count="3">
        <div style="display:flex; flex-direction:column; gap:7px;">
          <div style="font-family:'JetBrains Mono',monospace; font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:#A2988C;">{{ n.k }}</div>
          <div style="font-size:14.5px; line-height:1.55; color:#5A5249; text-wrap:pretty;">{{ n.v }}</div>
        </div>
      </sc-for>
    </section>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{}">
class Component extends DCLogic {
  renderVals() {
    return {
      cards: [
        { n:'01', tag:'22 states', href:'Crisp Dusk.dc.html', title:'Mobile', body:'The product. Every deliverable state on one phone canvas, driven by the rail on the left. Start the live microphone and talk — the nine bars follow your actual voice — or play the scripted session anywhere.', cta:'Open the prototype' },
        { n:'02', tag:'6 states', href:'Crisp Web.dc.html', title:'Web', body:'The same gesture with more air: one focused column, a resting dock, a three-item rail above 1000px, and the same Dusk environment while you talk.', cta:'Open the web app' },
        { n:'03', tag:'auto-plays', href:'Crisp Landing.dc.html', title:'Marketing', body:'The demo is the marketing. One hero that performs a real session, three lines, a mobile layout, and nothing else to read.', cta:'Open the landing page' },
        { n:'04', tag:'10 sections', href:'Crisp Spec.dc.html', title:'Handoff', body:'Exact colour, type, spacing, radius and depth tokens, nine component inventories, a twelve-row motion table, responsive and accessibility rules, and what was cut.', cta:'Open the handoff' },
        { n:'05', tag:'superseded', href:'Crisp App.dc.html', title:'Terracotta study', body:'The earlier single-environment direction, kept for reference: light throughout, with terracotta marking the live edge instead of a Dusk environment.', cta:'Open the study' }
      ],
      notes: [
        { k:'Live microphone', v:'The app uses on-device speech recognition, which today means Chrome. Everywhere else the scripted session runs the identical parser.' },
        { k:'Theme', v:'Parchment #F6F1EA to organize; ink #15120F with ember #E8894C to think out loud. The environment is derived from recording state, never offered as a setting.' },
        { k:'Open questions', v:'Notifications, recurring tasks and a second language are all out of V1 and unaddressed here — say the word and I will design them next.' }
      ]
    };
  }
}
</script>
</body>
</html>
